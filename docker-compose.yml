services:
  postgres:
    image: postgres:16-alpine
    container_name: reel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinema_booking"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - reel-network

volumes:
  postgres_data:
    name: reel_postgres_data

networks:
  reel-network:
    name: reel_network
    driver: bridge
